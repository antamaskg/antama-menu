<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ΑΝΤΑΜΑ | QR Menu</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#f5f5f5;
color:#222;
}

header{
background:#222;
color:white;
text-align:center;
padding:40px 20px;
}

header h1{
font-size:42px;
}

header p{
margin-top:10px;
font-size:18px;
color:#ddd;
}

.menu{
max-width:900px;
margin:auto;
padding:30px;
}

.category{
margin-top:40px;
}

.category h2{
border-bottom:3px solid #c89b3c;
padding-bottom:10px;
margin-bottom:20px;
}

.item{
background:white;
border-radius:15px;
padding:20px;
margin-bottom:20px;
box-shadow:0 4px 12px rgba(0,0,0,.08);
}

.item img{
width:100%;
border-radius:12px;
margin-bottom:15px;
}

.title{
display:flex;
justify-content:space-between;
font-size:22px;
font-weight:bold;
}

.price{
color:#c89b3c;
}

.desc{
margin-top:10px;
color:#555;
line-height:1.5;
}

footer{
margin-top:60px;
padding:30px;
text-align:center;
background:#222;
color:white;
}

</style>

</head>

<body>

<header>

<h1>ΑΝΤΑΜΑ</h1>

<p>Σύγχρονο Ρετσινάδικο</p>

</header>

<div class="menu">

<div class="category">

<h2>Ορεκτικά</h2>

<div class="item">

<img src="https://picsum.photos/800/450">

<div class="title">

<span>Πατάτες Τηγανητές</span>

<span class="price">4.50€</span>

</div>

<div class="desc">

Φρεσκοκομμένες πατάτες.

</div>

</div>

</div>

</div>

<footer>

ΑΝΤΑΜΑ © 2026

</footer>

</body>
</html>
